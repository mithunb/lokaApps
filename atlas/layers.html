<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add your data — LOKA Atlas</title>
  <meta name="robots" content="noindex" />
  <!-- Retired. Adding data now happens at /apps/atlas/add-data/, inside the
       atlas you are adding to. This file stays only to carry old links and
       bookmarks across — it forwards with the dataset intact, and sends anyone
       who arrives without one to their atlases. -->
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var slug = (qs.get("dataset") || "").trim();
      var to = slug ? "./add-data/?dataset=" + encodeURIComponent(slug) : "./setup/";
      // replace, not assign: Back should return where the person came from,
      // not bounce them through this page again
      location.replace(to);
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem">
    Adding data has moved. <a id="to" href="./setup/">Continue</a>.
  </p>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var slug = (qs.get("dataset") || "").trim();
      if (slug) document.getElementById("to").href = "./add-data/?dataset=" + encodeURIComponent(slug);
    })();
  </script>
</body>
</html>
