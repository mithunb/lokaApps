<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Add data — LOKA Atlas</title>
  <meta name="robots" content="noindex" />
  <!-- Adding data to an atlas you already have open. Replaces layers.html,
       which was a page from the old world: its own cream palette, its own nav
       pointing at a "setup wizard" that no longer means what it did, and its
       own sign-in even though you had to be signed in to get there.

       The work itself is unchanged — this mounts the same LokaDataBench module
       layers.html did, against the same API. What changed is the frame around
       it: the atlas you are adding to is named at the top, you leave by going
       back to it, and committing a layer returns you there rather than leaving
       you on a page with nowhere to go.

       databench.css deliberately styles only the module's own markup and takes
       page chrome — panel, buttons, form fields, tokens — from its host, so the
       bench renders in this page's world rather than the one it came from. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Lora:wght@700&display=swap" />
  <link rel="stylesheet" href="../databench.css?v=dev" />
  <style>
    :root {
      /* the atlas's own tokens (DESIGN.md frontmatter), repeated on every page */
      --color-page:#FAF8F3; --color-surface:#FDFCF8; --color-surface-alt:#F0EDE4;
      --color-text-primary:#24211D; --color-text-secondary:#5A5751; --color-text-muted:#6E6A63;
      --color-border:rgba(36,33,29,.18); --color-divider:rgba(36,33,29,.10);
      --color-leaf:#2A6B41; --color-leaf-deep:#1F5232; --color-leaf-tint:rgba(42,107,65,.10);
      --color-sindoor:#C9402B; --color-sindoor-deep:#9E3220; --color-sindoor-tint:rgba(201,64,43,.10);
      --color-marigold:#E9A237;
      /* a caution wash: marigold at .16 under Ink (14:1) or Ink Soft (6.3:1) —
         marigold itself is never text */
      --color-marigold-tint:rgba(233,162,55,.16);
      --color-toggle-off:#CFCBC2;
      --map-ground:#F5F1E6; --map-outside:#EAE6DC; --map-water:#3A7FA1; --map-water-fill:#C8DBE5;
      --map-boundary:#26231F; --map-block:#8C8985; --map-road:#E2DDD0; --map-label:#24211D; --map-halo:#F5F1E6;
      --ramp-1:#FBF1D9; --ramp-2:#F4CF82; --ramp-3:#E9A237; --ramp-4:#D2692A; --ramp-5:#A8321A;
      --point-1:#C9402B; --point-2:#2A6B41; --point-3:#E9A237; --point-4:#3A7FA1; --point-5:#A39E94; --point-6:#26231F; --point-7:#B99A1C;
      /* script companions (Noto faces for other languages) go here later. They
         hold the primary face itself until then: an EMPTY value makes the
         stack read "Lora", , serif — a double comma — and the whole
         font-family is thrown away (measured in Chrome: page fell to Times). */
      --font-companions-serif:"Lora"; --font-companions-sans:"Karla";
      --font-display:"Lora",var(--font-companions-serif),serif;
      --font-body:"Karla",var(--font-companions-sans),sans-serif;
      --t-display:clamp(1.6rem,4vw,2.4rem); --t-section:1.2rem; --t-body:1rem; --t-control:.95rem;
      --t-ui:.9rem; --t-meta:.8rem; --t-label:.72rem;
      --radius-xs:.125rem; --radius-md:.25rem; --radius-lg:.375rem; --radius-pill:999px;
      --shadow-sm:none; --shadow-md:0 1px 4px rgba(36,33,29,.10); --shadow-lg:0 2px 12px rgba(36,33,29,.12);
      --container:min(76rem,100% - 2.5rem);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--color-page); color:var(--color-text-primary);
      font-family:var(--font-body); font-size:var(--t-body); line-height:1.55;
      -webkit-font-smoothing:antialiased; }
    h1,h2,h3 { font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; margin:0; text-wrap:balance; }
    button { font:inherit; }
    [hidden] { display:none !important; }
    :focus-visible { outline:2px solid var(--color-leaf); outline-offset:2px; border-radius:var(--radius-md); }
    a { color:var(--color-leaf); }
    a:hover { color:var(--color-leaf-deep); }

    /* the bar names the atlas being changed, and is the way back to it */
    .bar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
      padding:.75rem clamp(.9rem,3vw,1.5rem); border-bottom:1px solid var(--color-divider); }
    .bar .id { min-width:0; flex:1 1 14rem; }
    .bar h1 { font-size:var(--t-section); line-height:1.25; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .bar .to { font-size:var(--t-meta); color:var(--color-text-muted); }

    .wrap { max-width:56rem; margin:0 auto; padding:clamp(1.1rem,4vw,2rem) clamp(.9rem,4vw,2rem) 4rem; }

    /* chrome the bench's markup expects from its host */
    .panel { background:var(--color-surface); border:1px solid var(--color-border);
      border-radius:var(--radius-lg); padding:clamp(1rem,3vw,1.6rem); }
    .panel > h2 { font-size:var(--t-section); line-height:1.25; margin-bottom:.5rem; }
    .hint { font-size:var(--t-meta); color:var(--color-text-muted); }
    /* buttons: primary is the leaf fill; secondary the leaf outline; quiet is
       borderless ink that underlines when reached for. Disabled only fades. */
    .btn { min-height:2.75rem; padding:.6rem 1.1rem; border:1px solid transparent;
      border-radius:var(--radius-md); background:var(--color-leaf); color:#fff;
      font-weight:600; font-size:var(--t-control); cursor:pointer; text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
      transition:background-color .15s ease-out, color .15s ease-out; }
    .btn:hover { background:var(--color-leaf-deep); color:#fff; }
    .btn.secondary { background:transparent; color:var(--color-leaf); border-color:var(--color-leaf); }
    .btn.secondary:hover { background:var(--color-leaf-tint); color:var(--color-leaf-deep); }
    .btn.quiet { background:none; color:var(--color-text-secondary); }
    .btn.quiet:hover { background:none; color:var(--color-text-primary); text-decoration:underline; text-underline-offset:.2em; }
    .btn:disabled, .btn:disabled:hover { opacity:.5; cursor:not-allowed; background:var(--color-leaf); color:#fff; text-decoration:none; }
    .btn.quiet:disabled, .btn.quiet:disabled:hover { background:none; color:var(--color-text-secondary); }
    .btn.secondary:disabled, .btn.secondary:disabled:hover { background:transparent; color:var(--color-leaf); }
    @media (prefers-reduced-motion:reduce) { .btn { transition:none; } }
    label.f, .f { display:flex; flex-wrap:wrap; align-items:baseline; gap:.15rem .4rem;
      font-size:var(--t-ui); font-weight:600; color:var(--color-text-secondary); margin-bottom:.9rem; }
    label.f > input, label.f > select, label.f > textarea,
    .f > input, .f > select, .f > textarea { flex:1 0 100%; margin-top:.2rem; }
    input, select, textarea { font:inherit; font-size:var(--t-control); font-weight:400;
      padding:.55rem .65rem; border:1px solid var(--color-border); border-radius:var(--radius-md);
      background:var(--color-surface); color:var(--color-text-primary); width:100%; min-height:2.75rem; }
    input::placeholder, textarea::placeholder { color:var(--color-text-muted); opacity:1; }
    .msg { margin-top:.9rem; padding:.6rem .8rem; border-radius:var(--radius-md); font-size:var(--t-ui); }
    .msg.err { background:var(--color-sindoor-tint); color:var(--color-sindoor-deep); }
    .msg.ok { background:var(--color-leaf-tint); color:var(--color-leaf-deep); }

    .gate { max-width:34rem; margin:10vh auto; padding:0 1rem; text-align:center; }
    .gate h2 { font-size:var(--t-section); line-height:1.25; margin-bottom:.4rem; }
    .gate p { color:var(--color-text-secondary); font-size:var(--t-body); text-wrap:pretty; }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <h2 id="gate-t">Loading…</h2>
    <p id="gate-p"></p>
    <p><a class="btn secondary" id="gate-a" href="../setup/" style="display:none">Your atlases</a></p>
  </div>

  <header class="bar" id="bar" hidden>
    <div class="id">
      <h1 id="atlas-title">…</h1>
      <span class="to" id="atlas-sub"></span>
    </div>
    <a class="btn quiet" id="back-to-atlas" href="#">← Back to the atlas</a>
  </header>

  <div class="wrap" id="wrap" hidden>
    <!-- No intro sentence: the header names the act, the drop zone says what
         to drop, and "nothing changes until you add it" is said at the foot of
         the last step — the one place it is both true and needed. -->
    <div id="bench"></div>
  </div>

  <script src="../vendor/papaparse.min.js"></script>
  <script src="../vendor/simplify.js"></script>
  <!-- ?v=dev is a placeholder — deploy/deploy.sh stamps every one of these with the
       commit it ships, so nobody has to remember. Hard-refresh locally. -->
  <script src="../ingest.js?v=dev"></script>
  <script src="../checktable.js?v=dev"></script>
  <script src="../databench.js?v=dev"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (s) { return document.querySelector(s); };
    var API = "../api/";
    var SLUG = (new URLSearchParams(location.search).get("dataset") || "").trim();

    function gate(t, p, link) {
      $("#gate").hidden = false;
      $("#gate-t").textContent = t;
      $("#gate-p").textContent = p || "";
      $("#gate-a").style.display = link ? "" : "none";
    }

    if (!SLUG) {
      gate("Which atlas?", "This page needs an atlas in its address.", true);
      return;
    }

    var backHref = "../?dataset=" + encodeURIComponent(SLUG);
    $("#back-to-atlas").href = backHref;

    // The atlas is fetched before the bench mounts, so the page can never
    // offer to add data to something the person cannot edit — the old page
    // let you upload first and refused at the very end.
    fetch(API + "instances/" + encodeURIComponent(SLUG), { credentials: "same-origin" })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { j._status = r.status; throw j; }
          return j;
        });
      })
      .then(function (inst) {
        if (!inst.canEdit) {
          gate("You cannot add data to this atlas",
            "It exists, but this account is not its owner and has not been invited to it.", true);
          return;
        }
        $("#atlas-title").textContent = "Add data to " + (inst.title || SLUG);
        $("#atlas-sub").textContent = inst.regionLabel ? "covering " + inst.regionLabel : "";
        document.title = "Add data to " + (inst.title || SLUG) + " — LOKA Atlas";
        $("#bar").hidden = false;
        $("#wrap").hidden = false;
        start(inst);
      })
      .catch(function (e) {
        if (e && (e._status === 401 || e.needsAuth)) {
          gate("Sign in first", "Adding data to an atlas needs the email it belongs to.", true);
        } else if (e && e._status === 404) {
          gate("No such atlas", "Nothing is here at “" + SLUG + "”, or it is not yours to open.", true);
        } else {
          gate("Could not open this atlas", (e && e.error) || "something went wrong", true);
        }
      });

    function start(inst) {
      window.__bench = window.LokaDataBench.mount($("#bench"), {
        mode: "standalone",
        api: API,
        // a private atlas lives outside the web root, so its draft preview has to
        // be fetched through the API instead of as a static file
        private: inst.visibility === "private",
        // this page sits one directory below the viewer, so the preview frame
        // must be told where the viewer is rather than assuming "./"
        viewer: "../",
        // Committing used to leave you on this page with the job done and
        // nowhere to go. The atlas is where the layer landed, so that is where
        // this returns — and the editor re-reads the manifest on load, so the
        // new layer is simply there.
        onCommitted: function () {
          location.href = backHref + "&added=1";
        },
      });
    }
  })();
  </script>
</body>
</html>
