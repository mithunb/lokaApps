<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your atlas — LOKA Atlas</title>
  <meta name="robots" content="noindex" />
  <!-- Retired. An atlas has one home: the atlas itself. Whoever owns it now
       gets its controls on that page (atlas/owner.js, loaded only for people
       the API says may edit), instead of on a second page that framed the
       viewer and drew a panel of its own beside it.

       This file stays only to carry old links and bookmarks across — it
       forwards with the dataset intact, and sends anyone who arrives without
       one to their list of atlases. -->
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var slug = (qs.get("dataset") || qs.get("atlas") || "").trim();
      var to = slug ? "../?dataset=" + encodeURIComponent(slug) : "../setup/";
      // replace, not assign: Back should return where the person came from,
      // not bounce them through this page again
      location.replace(to);
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem">
    An atlas is now managed on its own page. <a id="to" href="../setup/">Continue</a>.
  </p>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var slug = (qs.get("dataset") || qs.get("atlas") || "").trim();
      if (slug) document.getElementById("to").href = "../?dataset=" + encodeURIComponent(slug);
    })();
  </script>
</body>
</html>
