<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Your atlas — LOKA Atlas</title>
  <meta name="robots" content="noindex" />
  <!-- The atlas's own home. Reached at /apps/atlas/edit/?dataset=<slug> by the
       owner or an invited editor; everyone else is turned away by the API.

       This is the reviewed editor shell wired to real atlases. What it shows is
       real: identity, whether the atlas is live, the layers actually on it, the
       region, and who has been invited. The map is the REAL viewer in a frame
       (?embed=1 already strips its page furniture) rather than a second
       implementation of layer rendering that would drift from the first.

       DIRECTION (unchanged from the prototype)
       THESIS: an atlas has one home. Everything you do to it happens here.
       OWN-WORLD: the viewer's — paper ground, hairline ink borders, moss as the
         only interactive colour, Figtree stamps on DM Sans, the DESIGN.md ramp. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Figtree:wght@500;600;700&display=swap" />
  <style>
    :root {
      --color-bg:#F9F9F7; --color-bg-alt:#F0EFEA; --color-surface:#FFFFFF;
      --color-moss:#4A5A33; --color-canopy:#384526;
      --color-rust:#AE5028; --color-rust-deep:#7C3616;
      --color-ochre:#B8862F;
      --color-text-primary:#2A241A; --color-text-secondary:#564E3C; --color-text-muted:#6B6350;
      --color-divider:rgba(42,36,26,.09); --color-border:rgba(42,36,26,.14);
      --color-moss-tint:rgba(74,90,51,.10); --color-rust-tint:rgba(174,80,40,.10);
      --color-ochre-tint:rgba(184,134,47,.14);
      --color-map-ground:#EAE9E3;
      --t-section:1.15rem; --t-body:1rem; --t-control:.95rem; --t-ui:.875rem;
      --t-meta:.78rem; --t-label:.72rem;
      --shadow-md:0 1px 4px rgba(42,36,26,.10);
      --shadow-lg:0 2px 12px rgba(42,36,26,.12);
      --radius-md:.25rem; --radius-lg:.375rem;
      --sheet-peek:4.5rem;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--color-bg); color:var(--color-text-primary);
      font-family:'DM Sans',system-ui,-apple-system,sans-serif; font-size:var(--t-body); line-height:1.55;
      -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
    h1,h2,h3 { font-family:'Figtree',sans-serif; letter-spacing:-.01em; margin:0; text-wrap:balance; }
    button { font:inherit; }
    [hidden] { display:none !important; }
    :focus-visible { outline:2px solid var(--color-moss); outline-offset:2px; border-radius:4px; }
    :root { --color-cat-other:#7a756c; }

    /* ---------- top bar ---------- */
    .ed-bar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
      padding:.75rem clamp(.9rem,3vw,1.5rem); border-bottom:1px solid var(--color-divider);
      background:var(--color-bg); flex:0 0 auto; }
    .ed-id { min-width:0; flex:1 1 14rem; }
    .ed-id h1 { font-size:var(--t-section); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ed-id .by { font-size:var(--t-meta); color:var(--color-text-muted); }
    .ed-desc { font-size:var(--t-meta); color:var(--color-text-secondary); margin:.15rem 0 0;
      max-width:58ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ed-acts { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }

    .ed-status { display:inline-flex; align-items:center; gap:.45rem; font-size:var(--t-ui);
      padding:.35rem .7rem; border-radius:999px; border:1px solid var(--color-border);
      background:var(--color-surface); min-height:2rem; }
    .ed-status .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--color-text-muted); flex:0 0 auto; }
    .ed-status.live { border-color:rgba(74,90,51,.35); background:var(--color-moss-tint); color:var(--color-canopy); }
    .ed-status.live .dot { background:var(--color-moss); }

    .btn { min-height:2.75rem; padding:.55rem 1rem; border:1px solid transparent;
      border-radius:var(--radius-md); background:var(--color-moss); color:#fff;
      font-weight:600; font-size:var(--t-control); cursor:pointer; }
    .btn:hover { background:var(--color-canopy); }
    .btn.secondary { background:var(--color-surface); color:var(--color-text-primary); border-color:var(--color-border); }
    .btn.secondary:hover { background:var(--color-bg-alt); }
    .btn.quiet { background:none; color:var(--color-text-secondary); }
    .btn.quiet:hover { background:var(--color-bg-alt); }
    .btn.small { min-height:2.75rem; padding:.4rem .7rem; font-size:var(--t-ui); }
    .btn.danger { background:var(--color-surface); color:var(--color-rust-deep); border-color:var(--color-rust); }
    .btn.danger:hover { background:var(--color-rust-tint); }
    .btn:disabled, .btn:disabled:hover { background:var(--color-bg-alt); color:var(--color-text-muted);
      border-color:var(--color-border); cursor:not-allowed; }

    /* ---------- stage: the real viewer, framed, with the panel over it ---------- */
    .ed-stage { position:relative; flex:1 1 auto; min-height:0; background:var(--color-map-ground); }
    #ed-frame { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .frame-veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:var(--color-map-ground); color:var(--color-text-muted); font-size:var(--t-ui); z-index:2; }

    .pane { position:absolute; z-index:5; display:flex; flex-direction:column;
      background:var(--color-surface);
      border:1px solid var(--color-border); border-radius:var(--radius-md); box-shadow:var(--shadow-md);
      overflow:hidden; }
    .pane-head { display:flex; align-items:center; gap:.5rem; padding:.6rem .85rem;
      border-bottom:1px solid var(--color-divider); flex:0 0 auto; }
    .pane-head h2 { flex:1 1 auto; font-size:var(--t-label); letter-spacing:.14em;
      text-transform:uppercase; color:var(--color-text-secondary); font-weight:600; }
    .pane-count { font-size:var(--t-meta); color:var(--color-text-muted); flex:0 0 auto; }
    .pane-body { padding:.5rem .85rem .85rem; overflow:auto; flex:1 1 auto; }

    @media (min-width:821px) {
      #pane-layers { top:1rem; left:1rem; width:20.5rem; max-width:calc(100% - 2rem); max-height:calc(100% - 2rem); }
    }

    .lyr-group { font-size:var(--t-label); letter-spacing:.12em; text-transform:uppercase;
      color:var(--color-text-muted); font-weight:600; margin:.9rem 0 .2rem; }
    .lyr-group:first-child { margin-top:.2rem; }
    /* top-aligned, not centred: a layer with a nine-row legend is tall, and a
       switch centred on the whole row floats halfway down the legend instead
       of sitting beside the name it belongs to */
    .lyr { display:flex; align-items:flex-start; gap:.15rem; border-bottom:1px solid var(--color-divider); }
    .lyr:last-of-type { border-bottom:none; }
    .lyr-main { flex:1 1 auto; min-width:0; text-align:left; background:none; border:none;
      padding:.5rem 0; cursor:default; color:inherit; }

    /* Layer on/off. Most optional layers ship default:false (see recipes.py) —
       an atlas opens clean and you switch on what you want — so without this
       switch a layer the author chose in setup has no way of appearing at all.
       Same control the reader gets in the viewer's own panel, and like theirs
       it changes the view, not the atlas. */
    .lyr-toggle { flex:0 0 auto; display:flex; align-items:center; padding:.55rem .5rem .55rem 0;
      cursor:pointer; min-height:2.75rem; }
    .lyr-toggle input { position:absolute; opacity:0; width:0; height:0; }
    .lyr-switch { flex:0 0 auto; width:32px; height:18px; border-radius:999px; background:#CBC9C1;
      position:relative; transition:background .2s cubic-bezier(.25,1,.5,1); }
    .lyr-switch::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
      border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
      transition:transform .2s cubic-bezier(.25,1,.5,1); }
    .lyr-toggle input:checked + .lyr-switch { background:var(--color-moss); }
    .lyr-toggle input:checked + .lyr-switch::after { transform:translateX(14px); }
    .lyr-toggle input:focus-visible + .lyr-switch { outline:2px solid var(--color-moss); outline-offset:2px; }
    .lyr.off .lyr-name, .lyr.off .lyr-sub { color:var(--color-text-muted); }
    .lyr.off .lyr-leg { opacity:.45; }
    @media (prefers-reduced-motion:reduce) {
      .lyr-switch, .lyr-switch::after { transition:none; }
    }
    .lyr-name { display:block; font-size:var(--t-ui); font-weight:600; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .lyr-sub { display:block; font-size:var(--t-meta); color:var(--color-text-muted);
      overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .lyr-lock { flex:0 0 auto; font-size:var(--t-label); color:var(--color-text-muted);
      text-transform:uppercase; letter-spacing:.06em; }

    .base-row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding:.2rem 0 .5rem; }
    /* the reviewed prototype's segmented control, verbatim: two mutually
       exclusive ways to draw the same ground, not two independent switches */
    .seg { display:inline-flex; gap:.2rem; padding:.15rem; background:var(--color-bg-alt);
      border:1px solid var(--color-border); border-radius:var(--radius-md); }
    .seg-opt { font:inherit; font-size:var(--t-meta); padding:.4rem .7rem; min-height:2.5rem;
      border:none; border-radius:4px; background:none; color:var(--color-text-secondary); cursor:pointer; }
    .seg-opt.on { background:var(--color-moss-tint); color:var(--color-canopy); font-weight:600; }

    /* a layer's legend, under the layer it belongs to — the author's only way
       to see whether their category colours actually read as categories.
       The marks themselves come from iconkit.js, the same table the map draws
       from: this panel used to render its own coloured dots while the map drew
       icons, and a key that disagrees with the map is worse than no key. */
    .lyr-leg { display:flex; flex-direction:column; gap:.2rem; padding:.15rem 0 .35rem; }
    .leg-item { display:flex; align-items:center; gap:.45rem; font-size:var(--t-meta); color:var(--color-text-secondary); }
    .leg-icon { flex:0 0 auto; width:13px; height:13px; color:var(--c,var(--color-cat-other));
      display:inline-flex; align-items:center; justify-content:center; }
    .leg-icon svg { width:13px; height:13px; }
    .leg-badge { flex:0 0 auto; width:13px; height:13px; border-radius:50%;
      background:var(--c,var(--color-cat-other)); color:#fff; font-size:7px; font-weight:700;
      display:inline-flex; align-items:center; justify-content:center; letter-spacing:.02em; }
    .leg-badge.pale { color:var(--color-text-primary); }
    .leg-swatch { flex:0 0 auto; width:12px; height:12px; background:var(--c,var(--color-cat-other)); border-radius:2px; }
    .leg-swatch.dot { width:11px; height:11px; border-radius:50%; margin:0 1px; }
    .leg-swatch.line { height:4px; border-radius:2px; align-self:center; }
    .leg-swatch.dashed { height:4px; border-radius:0; align-self:center;
      background:repeating-linear-gradient(90deg, var(--c,var(--color-cat-other)) 0 3px, transparent 3px 5px); }
    .leg-swatch.triangle { border-radius:0; clip-path:polygon(50% 0, 0 100%, 100% 100%); }
    .leg-swatch.diamond { width:10px; height:10px; border-radius:0; transform:rotate(45deg); margin:0 1px; }

    /* ---------- search, floating top-centre over the map ----------
       The owner's direction: search belongs on the map, not in a panel. It is
       centred while the stage is wide enough, and slides just clear of the
       panel rather than on top of it when the stage narrows. Hidden until the
       frame reports there is text to search (see the ready message). */
    .ed-search { position:absolute; z-index:6; top:1rem; left:50%; transform:translateX(-50%);
      width:min(20rem, calc(100% - 1.5rem)); display:flex; flex-direction:column; gap:.3rem; }
    .ed-search input { width:100%; font:inherit; font-size:var(--t-ui); min-height:2.75rem;
      padding:.5rem .7rem; border:1px solid var(--color-border); border-radius:4px;
      background:var(--color-surface); color:var(--color-text-primary); box-shadow:var(--shadow-md); }
    .ed-search input:focus { outline:2px solid var(--color-moss); outline-offset:-1px; border-color:var(--color-moss); }
    .ed-search-count { align-self:center; font-size:var(--t-meta); color:var(--color-text-secondary);
      background:var(--color-surface); border:1px solid var(--color-divider); border-radius:999px;
      padding:.15rem .6rem; box-shadow:var(--shadow-md); }
    @media (min-width:821px) {
      .ed-search { left:max(calc(50% - 10rem), 22.5rem); transform:none; width:20rem; }
    }

    .region-line { display:grid; grid-template-columns:1fr auto; gap:0 .6rem; align-items:baseline;
      width:100%; min-height:2.75rem; padding:.4rem .5rem .45rem; margin:0 -.5rem .3rem;
      background:none; border:none; border-radius:var(--radius-md); text-align:left; cursor:pointer;
      color:inherit; font:inherit; }
    .region-line:hover { background:var(--color-bg-alt); }
    .region-k { grid-column:1; font-size:var(--t-meta); color:var(--color-text-muted); }
    .region-v { grid-column:1; font-family:'Figtree',sans-serif; font-size:var(--t-ui); font-weight:600; }
    .region-go { grid-column:2; grid-row:1/3; align-self:center; font-size:var(--t-meta);
      font-weight:600; color:var(--color-canopy); }

    .region-warn { margin:-.15rem 0 .5rem; font-size:var(--t-meta); color:var(--color-rust-deep);
      font-weight:600; }
    .empty { text-align:left; padding:.35rem 0 .6rem; }
    .empty b { font-family:'Figtree',sans-serif; font-size:var(--t-ui); }
    .empty p { font-size:var(--t-meta); color:var(--color-text-muted); margin:.15rem 0 0; max-width:34ch; }
    .add-row { border-top:1px solid var(--color-divider); margin-top:.7rem; padding-top:.8rem; }
    .add-row .btn { width:100%; }
    .linkish { background:none; border:none; padding:0; font:inherit; font-size:inherit;
      color:var(--color-canopy); text-decoration:underline; cursor:pointer; }

    /* ---------- dialogs ---------- */
    .scrim { position:fixed; inset:0; z-index:40; background:rgba(42,36,26,.34);
      display:flex; align-items:center; justify-content:center; padding:1rem; }
    .sheet { position:relative; width:min(34rem,100%); max-height:min(90vh,40rem); overflow:auto;
      background:var(--color-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
      padding:1.25rem 1.35rem; }
    .sheet h2 { font-size:var(--t-section); margin-bottom:.4rem; padding-right:2.5rem; }
    .sheet-xrow { position:sticky; top:0; z-index:2; height:0; display:flex; justify-content:flex-end; }
    .sheet-x { width:2.75rem; height:2.75rem; margin:-.35rem -.35rem 0 0; display:flex;
      align-items:center; justify-content:center; background:var(--color-surface); border:none;
      border-radius:var(--radius-md); font-size:var(--t-ui); line-height:1;
      color:var(--color-text-muted); cursor:pointer; }
    .sheet-x:hover { background:var(--color-bg-alt); color:var(--color-text-primary); }
    .sheet p { color:var(--color-text-secondary); font-size:var(--t-ui); margin:0 0 1rem; max-width:60ch; }
    .set-h { font-size:var(--t-ui); margin:1.3rem 0 .2rem; padding-top:1rem;
      border-top:1px solid var(--color-divider); }
    .sheet > .set-h:first-of-type { border-top:none; padding-top:0; margin-top:1rem; }
    .set-p { font-size:var(--t-meta); color:var(--color-text-muted); margin:0 0 .6rem; max-width:60ch; }

    .fld { display:flex; flex-wrap:wrap; align-items:baseline; gap:.15rem .4rem; margin-bottom:.9rem;
      font-size:var(--t-ui); font-weight:600; color:var(--color-text-secondary); }
    .fld > input, .fld > select, .fld > textarea { flex:1 0 100%; margin-top:.2rem; }
    .fld input, .fld select, .fld textarea { font:inherit; font-size:var(--t-body); font-weight:400;
      padding:.6rem .7rem; border:1px solid var(--color-border); border-radius:4px; background:#fff;
      color:var(--color-text-primary); width:100%; min-height:2.75rem; }
    .fld textarea { resize:vertical; line-height:1.45; }
    .fld .note { font-size:var(--t-meta); font-weight:400; color:var(--color-text-muted); }
    .save-row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
      padding-top:.75rem; border-top:1px solid var(--color-divider); }
    .set-err { font-size:var(--t-meta); color:var(--color-rust-deep); align-self:center; }
    .set-ok2 { font-size:var(--t-meta); color:var(--color-canopy); align-self:center; }

    /* the same place box the setup flow uses, so changing a region here and
       choosing one there are recognisably one control */
    .combo { position:relative; }
    .sugg { position:absolute; z-index:20; left:0; right:0; top:calc(100% + .2rem); margin:0; padding:.2rem;
      list-style:none; background:var(--color-surface); border:1px solid var(--color-border);
      border-radius:var(--radius-md); box-shadow:var(--shadow-lg); max-height:15rem; overflow:auto; }
    .sugg button { display:block; width:100%; text-align:left; background:none; border:none;
      padding:.5rem .6rem; border-radius:var(--radius-md); cursor:pointer; color:inherit; min-height:2.75rem; }
    .sugg button:hover, .sugg button[aria-selected="true"] { background:var(--color-moss-tint); }
    .sugg button[aria-selected="true"] { outline:2px solid var(--color-moss); outline-offset:-2px; }
    .sugg .nm { display:block; font-family:'Figtree',sans-serif; font-size:var(--t-ui); font-weight:600; }
    .sugg .wh { display:block; font-size:var(--t-meta); color:var(--color-text-muted); }
    .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
    .chip { display:inline-flex; align-items:center; gap:.15rem; padding:.3rem .3rem .3rem .6rem;
      background:var(--color-bg-alt); border-radius:999px; font-size:var(--t-ui); }
    .chip-alt { opacity:.62; }
    .chip .x { width:2.75rem; height:2.75rem; display:inline-flex; align-items:center; justify-content:center;
      background:none; border:none; cursor:pointer; color:inherit; border-radius:4px;
      margin:-.4rem -.35rem -.4rem 0; }
    .chip .x:hover { background:var(--color-rust-tint); color:var(--color-rust-deep); }
    .set-ok { font-size:var(--t-meta); color:var(--color-canopy); align-self:center; }

    .inv { display:flex; flex-direction:column; gap:.1rem; }
    .inv-row { display:flex; align-items:center; gap:.5rem; min-height:2.75rem;
      border-bottom:1px solid var(--color-divider); }
    .inv-row:last-child { border-bottom:none; }
    .inv-who { flex:1 1 auto; min-width:0; font-size:var(--t-ui); overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .inv-role { flex:0 0 auto; font-size:var(--t-meta); color:var(--color-text-muted); }
    .inv-x { flex:0 0 auto; width:2.75rem; height:2.75rem; background:none; border:none;
      color:var(--color-text-muted); cursor:pointer; border-radius:var(--radius-md); }
    .inv-x:hover { background:var(--color-rust-tint); color:var(--color-rust-deep); }
    .inv-add { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.6rem; }
    .inv-add input { flex:1 1 12rem; min-height:2.75rem; padding:.5rem .6rem; font:inherit;
      font-size:var(--t-ui); border:1px solid var(--color-border); border-radius:4px; }

    .toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:60;
      background:var(--color-text-primary); color:#fff; font-size:var(--t-ui);
      padding:.6rem 1rem; border-radius:var(--radius-md); box-shadow:var(--shadow-lg); max-width:90vw; }

    .gate { max-width:34rem; margin:12vh auto; padding:0 1rem; text-align:center; }
    .gate h1 { font-size:var(--t-section); margin-bottom:.4rem; }
    .gate p { color:var(--color-text-secondary); font-size:var(--t-ui); }

    /* ---------- phone: the panel becomes a bottom sheet ---------- */
    @media (max-width:820px) {
      .ed-bar { gap:.5rem .6rem; padding:.6rem .9rem; }
      .ed-id { flex:1 1 auto; }
      .ed-id h1 { font-size:var(--t-body); }
      .ed-id .by, .ed-desc { display:none; }
      .ed-acts { flex:0 0 auto; gap:.35rem; }
      .ed-status { padding:.3rem .55rem; font-size:var(--t-meta); }
      .ed-status .who { display:none; }
      #status-act, #share-btn, #settings-btn { padding:.4rem .6rem; font-size:var(--t-meta); }
      .pane { position:fixed; left:0; right:0; bottom:0; top:auto; width:auto; max-width:none;
        border-radius:var(--radius-lg) var(--radius-lg) 0 0; border-bottom:none;
        max-height:min(78vh,34rem); box-shadow:var(--shadow-lg);
        padding-bottom:env(safe-area-inset-bottom); }
      #pane-layers { transform:translateY(calc(100% - var(--sheet-peek))); transition:transform .22s cubic-bezier(.2,.8,.2,1); }
      #pane-layers.open { transform:translateY(0); }
      .pane-head { cursor:pointer; padding:.8rem .9rem 0; position:relative; padding-top:1.1rem; }
      .pane-head::before { content:""; position:absolute; top:.4rem; left:50%; transform:translateX(-50%);
        width:2.25rem; height:.25rem; border-radius:999px; background:var(--color-border); }
    }
    @media (prefers-reduced-motion:reduce) { #pane-layers { transition:none; } }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <h1 id="gate-t">Loading…</h1>
    <p id="gate-p"></p>
    <p><a id="gate-a" class="btn secondary" style="display:none;text-decoration:none" href="../setup/">Your atlases</a></p>
  </div>

  <header class="ed-bar" id="bar" hidden>
    <div class="ed-id">
      <h1 id="ed-title">…</h1>
      <span class="by" id="ed-by"></span>
      <p class="ed-desc" id="ed-desc" hidden></p>
    </div>
    <div class="ed-acts">
      <span class="ed-status" id="status" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span class="what" id="status-what">…</span>
        <span class="who" id="status-who"></span>
      </span>
      <button class="btn" id="status-act" hidden>Make it live</button>
      <button class="btn secondary" id="share-btn">Share</button>
      <button class="btn quiet" id="settings-btn">Settings</button>
    </div>
  </header>

  <main class="ed-stage" id="stage" hidden>
    <div class="frame-veil" id="veil">Drawing your atlas…</div>
    <iframe id="ed-frame" title="Your atlas" hidden></iframe>

    <!-- search floats over the map, top-centre, where the owner asked for it;
         the frame does the actual filtering (see the search message) -->
    <div class="ed-search" id="ed-search" hidden>
      <input type="search" id="ed-search-input" placeholder="Search the map…" aria-label="Search the map" autocomplete="off" />
      <span class="ed-search-count" id="ed-search-count" role="status" hidden></span>
    </div>

    <section class="pane" id="pane-layers" aria-label="Layers">
      <div class="pane-head" id="layers-head">
        <h2>Layers</h2>
        <span class="pane-count" id="layers-count"></span>
      </div>
      <div class="pane-body">
        <div class="lyr-group">Base map</div>
        <div class="base-row" id="base-row" hidden>
          <div class="seg" role="radiogroup" aria-label="Base map style" id="basemap-seg"></div>
        </div>
        <button class="region-line" id="region-line">
          <span class="region-k" id="region-k">Boundaries &amp; place names for</span>
          <span class="region-v" id="region-names"></span>
          <span class="region-go" aria-hidden="true">Change</span>
        </button>
        <p class="region-warn" id="region-warn" hidden></p>

        <div class="lyr-group">Your data</div>
        <div id="user-layers"></div>
        <div class="empty" id="user-empty" hidden>
          <b>Nothing of yours yet</b>
          <p>Add a spreadsheet of places and it becomes a layer you can style.</p>
        </div>

        <div class="lyr-group">Open data</div>
        <div id="catalog-layers"></div>
        <div class="empty" id="catalog-empty" hidden>
          <p>No extra open-data layers yet.</p>
        </div>

        <div class="add-row">
          <button class="btn" id="add-data">＋ Add data</button>
        </div>
      </div>
    </section>
  </main>

  <!-- the map's own icon table, so this panel's legend cannot drift from it.
       ?v= — bump on every deploy that touches a local .js/.css; see index.html -->
  <script src="../iconkit.js?v=20260813-3"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (s) { return document.querySelector(s); };
    var API = "../api/";
    var QS = new URLSearchParams(location.search);
    var SLUG = (QS.get("dataset") || QS.get("atlas") || "").trim();

    var INST = null, MANIFEST = null, LOCAL = null, ME = null;
    var LAYERS_MINE = [];      // the contributed layers, for the rebuild warning
    var MINE = [];             // what GET /layers/list says is on this atlas
    var BASEMAP = null;        // the author's basemap choice, re-asserted on every frame load

    function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
      return fetch(API + path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { j._status = r.status; throw j; }
          return j;
        });
      });
    }
    function errMsg(e) { return (e && (e.error || e.message)) || "something went wrong"; }
    function esc(v) {
      return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* ---- one toast element, reused: a shared timer with several nodes orphans
            whichever one the timer did not belong to ---- */
    var toastTimer, toastNode;
    function toast(text) {
      if (!toastNode) {
        toastNode = document.createElement("div");
        toastNode.className = "toast";
        toastNode.setAttribute("role", "status");
        document.body.appendChild(toastNode);
      }
      toastNode.textContent = text;
      toastNode.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastNode.hidden = true; }, 2600);
    }

    /* ---- dialogs: focus enters, Tab is trapped, the page behind is inert ---- */
    var dialogStack = [];
    function focusablesIn(root) {
      return [].slice.call(root.querySelectorAll(
        'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'))
        .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function openDialog(html, wire, guard) {
      var scrim = document.createElement("div");
      scrim.className = "scrim";
      scrim.innerHTML = html;
      var opener = document.activeElement;
      scrim.addEventListener("click", function (e) {
        if (e.target === scrim || e.target.hasAttribute("data-close")) closeDialog(scrim);
      });
      scrim.addEventListener("keydown", function (e) {
        if (e.key !== "Tab") return;
        var f = focusablesIn(scrim);
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
      var sheet = scrim.querySelector(".sheet");
      if (sheet && !sheet.querySelector(".sheet-x")) {
        var xrow = document.createElement("div");
        xrow.className = "sheet-xrow";
        xrow.innerHTML = '<button type="button" class="sheet-x" data-close aria-label="Close">✕</button>';
        sheet.insertBefore(xrow, sheet.firstChild);
      }
      document.body.appendChild(scrim);
      dialogStack.push({ scrim: scrim, opener: opener });
      document.querySelectorAll("header.ed-bar, main.ed-stage").forEach(function (n) { n.inert = true; });
      if (wire) wire(scrim);
      if (guard) scrim.__guard = guard;
      var f = focusablesIn(scrim).filter(function (n) { return !n.classList.contains("sheet-x"); });
      (f[0] || scrim.querySelector(".sheet-x") || scrim.querySelector(".sheet")).focus();
      return scrim;
    }
    function closeDialog(which) {
      var top = dialogStack[dialogStack.length - 1];
      if (!top) return;
      var entry = which ? dialogStack.filter(function (d) { return d.scrim === which; })[0] : top;
      if (!entry) return;
      if (entry.scrim.__guard && entry.scrim.__guard() === false) return;
      dialogStack = dialogStack.filter(function (d) { return d !== entry; });
      entry.scrim.remove();
      if (!dialogStack.length) {
        document.querySelectorAll("header.ed-bar, main.ed-stage").forEach(function (n) { n.inert = false; });
      }
      if (entry.opener && entry.opener.isConnected) entry.opener.focus();
    }
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && dialogStack.length) closeDialog();
    });

    /* ================= loading the real atlas ================= */

    function gate(title, body, showLink) {
      $("#gate").hidden = false;
      $("#gate-t").textContent = title;
      $("#gate-p").textContent = body || "";
      $("#gate-a").style.display = showLink ? "" : "none";
    }

    function datasetUrl(p) {
      // a private atlas is served from a different root; the viewer knows how to
      // find it, so the frame is the one thing that must not guess
      return "../datasets/" + encodeURIComponent(SLUG) + "/" + p;
    }

    function load() {
      if (!SLUG) { gate("Which atlas?", "This page needs an atlas in its address.", true); return; }
      api("auth/me").catch(function () { return null; }).then(function (me) {
        ME = me;
        return api("instances/" + encodeURIComponent(SLUG));
      }).then(function (inst) {
        if (!inst.canEdit) {
          gate("You cannot edit this atlas",
            "It exists, but this account is not its owner and has not been invited to it.", true);
          return null;
        }
        INST = inst;
        return loadManifests();
      }).then(function (ok) {
        if (ok === null) return;
        paintAll();
        $("#bar").hidden = false;
        $("#stage").hidden = false;
        showFrame();
        if (/(^|[?&])added=1/.test(location.search)) {
          toast("Layer added — it is on the map now");
          history.replaceState(null, "", location.pathname + "?dataset=" + encodeURIComponent(SLUG));
        }
      }).catch(function (e) {
        if (e && e._status === 404) {
          gate("No such atlas", "Nothing is published at “" + SLUG + "”, or it is not yours to open.", true);
        } else if (e && (e._status === 401 || e.needsAuth)) {
          gate("Sign in first", "Editing an atlas needs the email it belongs to.", true);
        } else {
          gate("Could not open this atlas", errMsg(e), true);
        }
      });
    }

    /* The base manifest is a static file beside the data, which is right for the
       region row and the base layers — that is what the viewer draws.
       The CONTRIBUTED layers are not read from a file. They were, and the panel
       could then disagree with every other surface: the add-data page asks the
       API and would list a layer this panel swore did not exist. A static file
       is also cacheable in a way the API call is not, so a browser holding the
       copy from before a layer was added showed an empty atlas indefinitely.
       GET /layers/list is the authority on WHICH layers exist; the overlay file
       is consulted only to describe them, and a stale one costs a sub-line
       rather than the layer itself. */
    function loadManifests() {
      return fetch(datasetUrl("manifest.json")).then(function (r) {
        if (!r.ok) throw { error: "the atlas data could not be read", _status: r.status };
        return r.json();
      }).then(function (m) {
        MANIFEST = m;
        return fetch(datasetUrl("manifest.local.json"))
          .then(function (r) { return r.ok ? r.json() : { layers: [] }; })
          .catch(function () { return { layers: [] }; });
      }).then(function (l) {
        LOCAL = l && Array.isArray(l.layers) ? l : { layers: [] };
        // the authority on what is actually on this atlas
        return api("layers/list?dataset=" + encodeURIComponent(SLUG))
          .then(function (r) { MINE = (r && r.layers) || []; })
          .catch(function () {
            // the API refused or is unreachable — fall back to the overlay file
            // rather than claiming the atlas is empty
            MINE = (LOCAL.layers || []).map(function (L) {
              return { id: L.id, label: L.label || L.id, addedBy: L.addedBy || null };
            });
          })
          .then(function () { return true; });
      });
    }

    function showFrame() {
      var f = $("#ed-frame");
      f.addEventListener("load", function () { $("#veil").hidden = true; f.hidden = false; });
      // panel=0: the viewer keeps its map and hands its panel's jobs — basemap,
      // search, legend — to this page, so the reader sees ONE panel, not two
      f.src = "../?dataset=" + encodeURIComponent(SLUG) + "&embed=map&panel=0";
    }

    /* ---- talking to the frame. postMessage, not f.contentWindow.someFn():
            the frame reloads whenever settings change it (reloadFrame), and a
            function reference captured before the reload would belong to a dead
            document — a message always lands in whichever document is in the
            frame now. The frame answers with "ready" (it boots asynchronously;
            until then there is nothing to drive) and pushes "count" whenever a
            search changes what is shown. ---- */
    function tellFrame(msg) {
      var w = $("#ed-frame").contentWindow;
      if (w) { try { w.postMessage(msg, location.origin); } catch (e) {} }
    }
    window.addEventListener("message", function (e) {
      if (e.origin !== location.origin) return;   // the frame is same-origin; nothing else is expected
      var m = e.data || {};
      if (m.atlas === "ready") {
        // a search box with nothing to search would be a promise the atlas
        // cannot keep — the frame knows, because it has read the data
        $("#ed-search").hidden = !m.searchable;
        // a reloaded frame boots at its manifest defaults; put the author's
        // standing choices back so a settings save doesn't visibly undo them
        if (BASEMAP) tellFrame({ atlas: "set-basemap", id: BASEMAP });
        Object.keys(VIS).forEach(function (id) {
          tellFrame({ atlas: "set-layer-visible", id: id, show: VIS[id] });
        });
        var q = $("#ed-search-input").value.trim();
        if (q) tellFrame({ atlas: "search", q: q });
      } else if (m.atlas === "count") {
        paintSearchCount(m.shown, m.total);
      }
    });

    $("#ed-search-input").addEventListener("input", function () {
      tellFrame({ atlas: "search", q: this.value });
    });
    // the ✕ some browsers draw in type=search fires "search", not "input"
    $("#ed-search-input").addEventListener("search", function () {
      tellFrame({ atlas: "search", q: this.value });
    });
    function paintSearchCount(shown, total) {
      var c = $("#ed-search-count");
      if (shown == null) { c.hidden = true; c.textContent = ""; return; }
      c.hidden = false;
      // the same words the viewer's own box used, so the meaning travels
      c.textContent = shown ? shown + " of " + total + " shown" : "nothing matched — try another word";
    }

    /* ================= painting what is actually there ================= */

    function paintAll() {
      paintIdentity(); paintStatus(); paintBasemaps(); paintRegion(); paintLayers();
    }

    // The frame's own Map/Satellite switch is hidden with the rest of its
    // panel, so the choice lives here, beside the region it re-draws. Built
    // from this page's copy of the manifest — the same file the viewer read,
    // so the two can only disagree if the atlas itself changed under us (and
    // a frame reload fixes both at once).
    function paintBasemaps() {
      var host = $("#basemap-seg"), row = $("#base-row");
      var maps = (MANIFEST && MANIFEST.basemaps) || [];
      // one basemap is not a choice; showing a one-button switch would be noise
      if (maps.length < 2) { row.hidden = true; return; }
      if (!BASEMAP) BASEMAP = (maps.filter(function (b) { return b.default; })[0] || maps[0]).id;
      host.innerHTML = "";
      maps.forEach(function (b) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seg-opt" + (b.id === BASEMAP ? " on" : "");
        btn.setAttribute("role", "radio");
        btn.setAttribute("aria-checked", String(b.id === BASEMAP));
        btn.textContent = b.label || b.id;
        btn.onclick = function () {
          BASEMAP = b.id;
          tellFrame({ atlas: "set-basemap", id: b.id });
          host.querySelectorAll(".seg-opt").forEach(function (x) {
            var on = x === btn;
            x.classList.toggle("on", on);
            x.setAttribute("aria-checked", String(on));
          });
        };
        host.appendChild(btn);
      });
      row.hidden = false;
    }

    function paintIdentity() {
      $("#ed-title").textContent = INST.title || SLUG;
      document.title = (INST.title || SLUG) + " — LOKA Atlas";
      var org = (INST.branding && INST.branding.orgName) || INST.org || "";
      var role = INST.role === "owner" ? "you are the owner" : "you can edit this";
      $("#ed-by").textContent = (org ? "by " + org + " · " : "") + role;
      var d = $("#ed-desc");
      d.textContent = INST.subtitle || "";
      d.hidden = !INST.subtitle;
    }

    // Two axes, said as one sentence. `published` is what makes an atlas
    // listed and openable by anyone with the link; `private` moves it out of
    // the web root entirely.
    function paintStatus() {
      var live = INST.status === "published";
      var priv = INST.visibility === "private";
      var el = $("#status");
      el.classList.toggle("live", live);
      $("#status-what").textContent = live ? "Live" : "Not live";
      $("#status-who").textContent = live
        ? (priv ? "— only invited people" : "— anyone with the link")
        : "— only you can see it";
      var act = $("#status-act");
      // only the owner decides whether an atlas is on the air
      act.hidden = INST.role !== "owner" || INST.status === "building";
      act.textContent = live ? "Take it off" : "Make it live";
      act.className = live ? "btn secondary" : "btn";
    }

    // The row claimed boundaries and place names were drawn whatever the atlas
    // actually held — and an atlas built before those layers existed, or one
    // whose base manifest is empty, has neither. Say what is really there.
    function baseLayerNames() {
      var have = [];
      (MANIFEST.layers || []).forEach(function (L) {
        var id = String(L.id || "").toLowerCase();
        if (/^(admin|boundary|boundaries)$/.test(id)) have.push("Boundaries");
        else if (/^(labels|placenames|place-names)$/.test(id)) have.push("place names");
      });
      return have;
    }
    function paintRegion() {
      var label = INST.regionLabel || (INST.region && INST.region.label) || "";
      var have = baseLayerNames();
      var lead = have.length
        ? have.join(" & ") + " for"
        : "This atlas covers";
      $("#region-k").textContent = lead;
      $("#region-names").textContent = label || "no region recorded";
      $("#region-line").setAttribute("aria-label",
        (have.length ? "Boundaries and place names are drawn for " : "This atlas covers ") +
        (label || "no region yet") + ". Change the region.");
      // an atlas with no base layers at all should say so rather than leave the
      // reader to notice an empty map
      var warn = $("#region-warn");
      warn.hidden = have.length > 0;
      warn.textContent = have.length ? "" : "No boundary or place-name layers were built for it.";
    }

    // A contributed layer is one the import pipeline wrote: it lives in
    // manifest.local.json, or its source is a user-*.geojson. Everything in the
    // base manifest is the catalogue's.
    function isUserLayer(L, fromLocal) {
      return fromLocal || L.userLayer === true || /^user-[a-z0-9-]+\.geojson$/.test(String(L.source || ""));
    }
    function layerSub(L) {
      var bits = [];
      if (L.legend && L.legend.length) bits.push(L.legend.length + (L.legend.length === 1 ? " class" : " classes"));
      if (L.type) bits.push(L.type === "marker" ? "points" : L.type);
      if (L.attribution) bits.push(String(L.attribution).slice(0, 60));
      return bits.join(" · ");
    }

    function paintLayers() {
      var base = (MANIFEST.layers || []).map(function (L) { return { L: L, local: false }; });

      // MINE decides existence; the overlay file only describes. A layer the
      // API knows about is listed even when the file is stale or unreadable —
      // it just carries less detail on its second line.
      var byId = {};
      (LOCAL.layers || []).forEach(function (L) { byId[L.id] = L; });
      var mine = MINE.map(function (m) {
        var L = byId[m.id] || {};
        return { L: Object.assign({}, L, { id: m.id, label: m.label || L.label || m.id }), local: true };
      });

      // "boundaries and place names" are the base map, spoken for by the region
      // row above — listing them again as layers was the thing to remove
      var theirs = base.filter(function (e) {
        return !isUserLayer(e.L, e.local) && !/^(admin|labels|boundary|boundaries)$/i.test(String(e.L.id || ""));
      });

      LAYERS_MINE = mine;
      fill("#user-layers", mine, true);
      fill("#catalog-layers", theirs, false);
      $("#user-empty").hidden = mine.length > 0;
      $("#catalog-empty").hidden = theirs.length > 0;

      var n = mine.length + theirs.length;
      $("#layers-count").textContent = n ? n + " on the map" : "base map only";
    }
    // The legend used to live in the frame's panel; with that panel gone it
    // belongs here, under the layer whose classes it names — this is how an
    // author sees whether their category colours actually read. Drawn from the
    // layer stanza's own legend array; a layer without one simply has no rows.
    var LEG_SHAPES = { box: 1, dot: 1, line: 1, dashed: 1, triangle: 1, diamond: 1 };
    function legendHTML(L) {
      var rows = Array.isArray(L.legend) ? L.legend : [];
      if (!rows.length) return "";
      return '<span class="lyr-leg">' + rows.map(function (it) {
        var row = it;
        if (it.shape && !LEG_SHAPES[it.shape]) row = Object.assign({}, it, { shape: "box" });
        return '<span class="leg-item">' + LokaIcons.swatchHTML(row, esc) +
          "<span>" + esc(it.label) + "</span></span>";
      }).join("") + "</span>";
    }

    /* Whether a layer starts on. Mirrors the viewer's own on(L) — a layer is
       shown unless its stanza says default:false — so the switch agrees with
       the map on first paint without having to ask the frame. VIS holds only
       what the author has since changed. */
    var VIS = {};
    function layerOn(L) { return VIS[L.id] != null ? VIS[L.id] : L.default !== false; }

    function fill(sel, entries, owned) {
      var host = $(sel);
      host.innerHTML = "";
      entries.forEach(function (e) {
        var L = e.L, shown = layerOn(L);
        var row = document.createElement("div");
        row.className = "lyr" + (shown ? "" : " off");

        var toggle = document.createElement("label");
        toggle.className = "lyr-toggle";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = shown;
        cb.setAttribute("aria-label", "Show " + (L.label || L.id) + " on the map");
        var sw = document.createElement("span");
        sw.className = "lyr-switch";
        toggle.appendChild(cb); toggle.appendChild(sw);
        cb.onchange = function () { setLayerShown(L, cb.checked, row); };
        row.appendChild(toggle);

        var main = document.createElement("span");
        main.className = "lyr-main";
        main.innerHTML =
          '<span class="lyr-name">' + esc(L.label || L.id) + "</span>" +
          '<span class="lyr-sub">' + esc(layerSub(L)) + "</span>" +
          legendHTML(L);
        row.appendChild(main);

        if (!owned) {
          var lock = document.createElement("span");
          lock.className = "lyr-lock";
          lock.textContent = "open data";
          row.appendChild(lock);
        }
        host.appendChild(row);
      });
    }

    function setLayerShown(L, show, row) {
      VIS[L.id] = show;
      if (row) row.classList.toggle("off", !show);
      tellFrame({ atlas: "set-layer-visible", id: L.id, show: show });
    }

    /* ================= the things you can actually do ================= */

    $("#status-act").onclick = function () {
      var btn = this, live = INST.status === "published";
      btn.disabled = true;
      api("instances/" + encodeURIComponent(SLUG) + "/" + (live ? "unpublish" : "publish"), { method: "POST" })
        .then(function () {
          INST.status = live ? "built" : "published";
          paintStatus();
          toast(live ? "Taken off the air — only you can see it now" : "Live — anyone with the link can open it");
        })
        .catch(function (e) {
          toast(errMsg(e));
          if (e && (e._status === 401 || e.needsAuth)) {
            gate("Sign in first", "Publishing an atlas needs the email it belongs to.", true);
          }
        })
        .then(function () { btn.disabled = false; });
    };

    $("#share-btn").onclick = function () {
      var url = location.origin + location.pathname.replace(/edit\/$/, "") + "?dataset=" + encodeURIComponent(SLUG);
      openDialog(
        '<div class="sheet" role="dialog" aria-modal="true" aria-label="Share this atlas">' +
          "<h2>Share</h2>" +
          "<p>" + (INST.status === "published"
            ? "Anyone with this link can open your atlas."
            : "This atlas is not live yet — the link works only for you until you make it live.") + "</p>" +
          '<label class="fld">Link<input type="text" id="share-url" readonly value="' + esc(url) + '" /></label>' +
          '<div class="save-row"><button class="btn" id="share-copy">Copy the link</button>' +
            '<span class="set-ok" id="share-said"></span></div>' +
        "</div>",
        function (scrim) {
          scrim.querySelector("#share-url").onfocus = function () { this.select(); };
          scrim.querySelector("#share-copy").onclick = function () {
            var input = scrim.querySelector("#share-url");
            input.select();
            var said = scrim.querySelector("#share-said");
            // navigator.clipboard needs a secure context and can be refused;
            // the selected field is the fallback that always works
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(input.value)
                .then(function () { said.textContent = "Copied."; })
                .catch(function () { said.textContent = "Press ⌘C to copy."; });
            } else { said.textContent = "Press ⌘C to copy."; }
          };
        });
    };

    $("#add-data").onclick = function () {
      location.href = "../add-data/?dataset=" + encodeURIComponent(SLUG);
    };
    $("#region-line").onclick = function () { openSettings("region"); };
    $("#settings-btn").onclick = function () { openSettings(); };

    function settingsHTML() {
      var b = INST.branding || {};
      var owner = INST.role === "owner";
      return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Atlas settings">' +
        "<h2>Settings</h2>" +

        '<h3 class="set-h">Region</h3>' +
        '<p class="set-p">Where this atlas covers. Changing it rebuilds the base map, which takes a ' +
          'few minutes — the atlas stays up and your own data layers are kept.</p>' +
        '<div class="chips" id="set-chips"></div>' +
        '<label class="fld combo" style="margin-top:.6rem">Add a place' +
          '<input type="text" id="set-place" placeholder="Type a district, block or state…" ' +
            'autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" ' +
            'aria-controls="set-sugg" />' +
          '<ul class="sugg" id="set-sugg" role="listbox" aria-label="Matching places" hidden></ul>' +
        "</label>" +
        '<div class="save-row" style="border:none;padding-top:.2rem">' +
          '<button class="btn secondary small" id="region-save" disabled>Rebuild with this region</button>' +
          '<span class="set-err" id="region-msg" role="alert"></span></div>' +

        '<h3 class="set-h">Identity</h3>' +
        '<label class="fld">Atlas title' +
          '<input type="text" id="set-title" maxlength="80" value="' + esc(INST.title || "") + '" /></label>' +
        '<label class="fld">What this atlas is for <span class="note">shown under the title</span>' +
          '<textarea id="set-desc" rows="3" maxlength="160">' + esc(INST.subtitle || "") + "</textarea></label>" +
        '<label class="fld">Organisation website <span class="note">optional, https</span>' +
          '<input type="text" id="set-site" placeholder="https://example.org" value="' + esc(b.orgUrl || "") + '" /></label>' +

        (owner ? '<h3 class="set-h">Who can edit it</h3>' +
        '<p class="set-p">Invite the people who need to work on this atlas. They can add and style ' +
          "data; only you can delete it or take it off the air.</p>" +
        '<div class="inv" id="inv-list"></div>' +
        '<div class="inv-add">' +
          '<input type="email" id="inv-email" aria-label="Email address to invite" ' +
            'placeholder="name@organisation.org" autocomplete="off" />' +
          '<button class="btn secondary small" id="inv-go">Invite</button>' +
        "</div>" : "") +

        '<div class="save-row" style="margin-top:1.25rem">' +
          '<button class="btn" id="set-save">Save changes</button>' +
          '<span class="set-err" id="set-err" role="alert"></span></div>' +
      "</div>";
    }

    function identityDirty(scrim) {
      var t = scrim.querySelector("#set-title");
      if (!t) return false;
      var b = INST.branding || {};
      return t.value.trim() !== (INST.title || "") ||
        scrim.querySelector("#set-desc").value.trim() !== (INST.subtitle || "") ||
        scrim.querySelector("#set-site").value.trim() !== (b.orgUrl || "");
    }

    /* ================= region: search, chips, rebuild ================= */
    /* The region is the one setting that cannot just be saved — it rebuilds the
       base map from open data. The build swaps the dataset atomically and now
       carries contributed layers across, so the atlas stays up and your own data
       survives; what a person still needs to be told is that rows can end up
       outside a region that shrank. */
    var REG = { chosen: null, level: 2, dirty: false };

    function regionInit(scrim) {
      // start from what the atlas actually has, so "no change" is the default
      var r = INST.region || {};
      REG.level = Number(r.level) || 2;
      REG.chosen = (r.shapeIDs || []).map(function (id, i) {
        var names = r.shapeNames || [];
        return { id: id, name: names[i] || id, label: names[i] || id, level: REG.level };
      });
      REG.dirty = false;
      paintRegionChips(scrim);
      wireRegionSearch(scrim);
    }

    function paintRegionChips(scrim) {
      var host = scrim.querySelector("#set-chips");
      if (!host) return;
      host.innerHTML = "";
      if (!REG.chosen.length) {
        host.innerHTML = '<span class="set-p" style="margin:0">No places yet.</span>';
      }
      REG.chosen.forEach(function (c) {
        var renamed = c.label !== c.name;
        var el = document.createElement("span");
        el.className = "chip";
        if (renamed) el.title = 'The boundary data calls this "' + c.name + '"';
        el.innerHTML = "<span>" + esc(c.label) +
            (renamed ? ' <span class="chip-alt">(' + esc(c.name) + ")</span>" : "") + "</span>" +
          '<button class="x" aria-label="Remove ' + esc(c.label) + '">✕</button>';
        el.querySelector(".x").onclick = function () {
          REG.chosen = REG.chosen.filter(function (x) { return x.id !== c.id; });
          REG.dirty = true;
          paintRegionChips(scrim);
        };
        host.appendChild(el);
      });
      var save = scrim.querySelector("#region-save");
      if (save) save.disabled = !REG.dirty || !REG.chosen.length;
      var m = scrim.querySelector("#region-msg");
      if (m && !REG.chosen.length) m.textContent = "An atlas needs at least one place.";
      else if (m && m.textContent === "An atlas needs at least one place.") m.textContent = "";
    }

    function wireRegionSearch(scrim) {
      var box = scrim.querySelector("#set-place"), sugg = scrim.querySelector("#set-sugg");
      if (!box) return;
      var shown = [], cursor = -1, seq = 0, timer;
      var iso3 = (INST.region && INST.region.iso3) || "IND";

      function close() {
        sugg.hidden = true; box.setAttribute("aria-expanded", "false"); cursor = -1;
        box.removeAttribute("aria-activedescendant");
      }
      function paint() {
        sugg.innerHTML = "";
        if (!shown.length) { close(); return; }
        shown.forEach(function (p, i) {
          var li = document.createElement("li");
          li.setAttribute("role", "presentation");
          var b = document.createElement("button");
          b.type = "button"; b.setAttribute("role", "option"); b.id = "set-opt-" + i;
          b.setAttribute("aria-selected", i === cursor ? "true" : "false");
          var lead = properName((p.alias && p.alias.typed) || p.name);
          var note = p.alias && p.alias.inData && p.alias.inData !== lead
            ? ' · listed as "' + p.alias.inData + '" in the boundary data' : "";
          b.innerHTML = '<span class="nm">' + esc(lead) + "</span>" +
            '<span class="wh">' + esc(p.label || "") + esc(note) + "</span>";
          b.onclick = function () { pick(p, lead); };
          li.appendChild(b); sugg.appendChild(li);
        });
        sugg.hidden = false; box.setAttribute("aria-expanded", "true");
        if (cursor >= 0) box.setAttribute("aria-activedescendant", "set-opt-" + cursor);
        else box.removeAttribute("aria-activedescendant");
      }
      function pick(p, label) {
        // one build, one admin level — the API resolves shapeIDs against a
        // single level, so mixing them would silently drop units
        if (REG.chosen.length && (p.level || 2) !== REG.level) {
          scrim.querySelector("#region-msg").textContent =
            "An atlas is built at one level of detail. Remove the places you have first to switch level.";
          box.value = ""; shown = []; close();
          return;
        }
        REG.level = p.level || 2;
        if (!REG.chosen.some(function (c) { return c.id === p.id; })) {
          REG.chosen.push({ id: p.id, name: p.name, label: label || p.name, level: REG.level });
          REG.dirty = true;
        }
        scrim.querySelector("#region-msg").textContent = "";
        box.value = ""; shown = []; close();
        paintRegionChips(scrim);
        box.focus();
      }
      function search(q) {
        q = q.trim();
        if (q.length < 2) { shown = []; close(); return; }
        var mine = ++seq;
        api("geo/search?iso3=" + encodeURIComponent(iso3) + "&q=" + encodeURIComponent(q) + "&limit=8")
          .then(function (r) {
            if (mine !== seq) return;
            shown = (r.matches || []).filter(function (m) {
              return !REG.chosen.some(function (c) { return c.id === m.id; });
            });
            cursor = -1; paint();
          })
          .catch(function () { if (mine === seq) { shown = []; close(); } });
      }
      box.addEventListener("input", function () {
        clearTimeout(timer);
        var v = this.value;
        timer = setTimeout(function () { search(v); }, 220);
      });
      box.addEventListener("keydown", function (e) {
        if (sugg.hidden) {
          if (e.key === "ArrowDown" && box.value.trim().length >= 2) { e.preventDefault(); search(box.value); }
          return;
        }
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          cursor += e.key === "ArrowDown" ? 1 : -1;
          if (cursor < 0) cursor = shown.length - 1;
          if (cursor >= shown.length) cursor = 0;
          paint();
        } else if (e.key === "Enter") {
          if (cursor >= 0 && shown[cursor]) {
            e.preventDefault();
            pick(shown[cursor], properName((shown[cursor].alias && shown[cursor].alias.typed) || shown[cursor].name));
          }
        } else if (e.key === "Escape") { e.stopPropagation(); close(); }
      });
    }
    function properName(v) {
      return String(v || "").split(/\s+/).map(function (w) {
        return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
      }).join(" ");
    }

    function rebuildRegion(scrim, btn) {
      var m = scrim.querySelector("#region-msg");
      var mine = LAYERS_MINE.length;
      var warn = mine
        ? "Rebuilding the base map for " + REG.chosen.map(function (c) { return c.label; }).join(", ") +
          ". Your " + mine + (mine === 1 ? " data layer is" : " data layers are") + " kept, but rows " +
          "outside the new region will sit off the map. Go ahead?"
        : "Rebuilding the base map for " + REG.chosen.map(function (c) { return c.label; }).join(", ") + ". Go ahead?";
      if (!window.confirm(warn)) return;

      btn.disabled = true; m.className = "set-err"; m.textContent = "";
      api("instances/" + encodeURIComponent(SLUG) + "/rebuild", {
        method: "POST",
        body: { region: { iso3: (INST.region && INST.region.iso3) || "IND", level: REG.level,
                          shapeIDs: REG.chosen.map(function (c) { return c.id; }) } },
      }).then(function (r) {
        closeDialog(scrim);
        toast("Rebuilding — this takes a few minutes. The atlas stays up meanwhile.");
        if (r.jobId) watchRebuild(r.jobId);
      }).catch(function (e) {
        btn.disabled = false;
        m.textContent = errMsg(e);
      });
    }

    // the atlas is live throughout, so this only has to say when it is done
    function watchRebuild(jobId) {
      var tick = function () {
        api("jobs/" + encodeURIComponent(jobId)).then(function (j) {
          if (j.status === "done") {
            toast("Region rebuilt — reloading the map");
            setTimeout(function () { location.reload(); }, 900);
            return;
          }
          if (j.status === "failed") {
            toast("The rebuild failed — your atlas is unchanged. " + (j.message || ""));
            return;
          }
          setTimeout(tick, 2500);
        }).catch(function () { /* stop watching; the atlas is untouched either way */ });
      };
      setTimeout(tick, 2500);
    }

    function openSettings(land) {
      var sheet = openDialog(settingsHTML(), function (scrim) {
        regionInit(scrim);
        var rs = scrim.querySelector("#region-save");
        if (rs) rs.onclick = function () { rebuildRegion(scrim, this); };
        paintInvites(scrim);
        ["#set-title", "#set-desc", "#set-site"].forEach(function (sel) {
          scrim.querySelector(sel).addEventListener("input", function () {
            scrim.__warned = false;
            scrim.querySelector("#set-err").textContent = "";
          });
        });
        var go = scrim.querySelector("#inv-go");
        if (go) go.onclick = function () { invite(scrim); };
        scrim.querySelector("#set-save").onclick = function () { saveIdentity(scrim, this); };
      }, function () {
        var scrim = dialogStack[dialogStack.length - 1].scrim;
        if (!identityDirty(scrim) || scrim.__warned) return true;
        scrim.__warned = true;
        scrim.querySelector("#set-err").textContent = "Unsaved changes. Save them, or close again to discard.";
        scrim.querySelector("#set-save").focus();
        return false;
      });
      if (land === "region") {
        var pl = sheet.querySelector("#set-place");
        if (pl) { pl.scrollIntoView({ block: "start" }); pl.focus(); }
      }
      return sheet;
    }

    function saveIdentity(scrim, btn) {
      var t = scrim.querySelector("#set-title"), err = scrim.querySelector("#set-err");
      if (!t.value.trim()) { err.textContent = "An atlas cannot be untitled."; t.focus(); return; }
      var site = scrim.querySelector("#set-site").value.trim();
      if (site && !/^https:\/\/[^\s]+$/.test(site)) {
        err.textContent = "A website has to start with https://";
        scrim.querySelector("#set-site").focus();
        return;
      }
      btn.disabled = true; err.textContent = "";
      api("instances/" + encodeURIComponent(SLUG) + "/details", {
        method: "POST",
        body: {
          title: t.value.trim(),
          subtitle: scrim.querySelector("#set-desc").value.trim(),
          branding: { orgUrl: site },
        },
      }).then(function () {
        INST.title = t.value.trim();
        INST.subtitle = scrim.querySelector("#set-desc").value.trim();
        INST.branding = Object.assign({}, INST.branding, { orgUrl: site });
        scrim.__warned = true;              // nothing left to lose
        paintIdentity();
        closeDialog(scrim);
        toast("Settings saved");
        reloadFrame();                      // the viewer draws the title too
      }).catch(function (e) {
        err.textContent = errMsg(e);
      }).then(function () { btn.disabled = false; });
    }

    function paintInvites(scrim) {
      var host = scrim.querySelector("#inv-list");
      if (!host) return;
      var list = INST.collaborators || [];
      host.innerHTML = "";
      if (!list.length) {
        host.innerHTML = '<p class="set-p" style="margin:0">Nobody yet.</p>';
        return;
      }
      list.forEach(function (c) {
        var row = document.createElement("div");
        row.className = "inv-row";
        row.innerHTML = '<span class="inv-who">' + esc(c.email) + "</span>" +
          '<span class="inv-role">' + (c.acceptedAt ? "editing" : "invited") + "</span>" +
          '<button class="inv-x" aria-label="Remove ' + esc(c.email) + '">✕</button>';
        row.querySelector(".inv-x").onclick = function () {
          this.disabled = true;
          api("instances/" + encodeURIComponent(SLUG) + "/collaborators", {
            method: "DELETE", body: { email: c.email },
          }).then(function (r) {
            INST.collaborators = r.collaborators || [];
            paintInvites(scrim);
            toast("Removed " + c.email);
          }).catch(function (e) { toast(errMsg(e)); this.disabled = false; }.bind(this));
        };
        host.appendChild(row);
      });
    }

    function invite(scrim) {
      var em = scrim.querySelector("#inv-email"), go = scrim.querySelector("#inv-go");
      var v = em.value.trim();
      if (!v) { em.focus(); return; }
      go.disabled = true;
      api("instances/" + encodeURIComponent(SLUG) + "/collaborators", { method: "POST", body: { email: v } })
        .then(function (r) {
          INST.collaborators = r.collaborators || [];
          em.value = "";
          paintInvites(scrim);
          // the invitation is an email; saying "invited" when it did not send
          // would be the atlas lying about something the person cannot see
          toast(r.sent === false ? "Added, but the email could not be sent" : "Invited " + v);
        })
        .catch(function (e) { scrim.querySelector("#set-err").textContent = errMsg(e); })
        .then(function () { go.disabled = false; });
    }

    function reloadFrame() {
      var f = $("#ed-frame");
      if (f.src) f.src = f.src;      // the manifest it read has just changed
    }

    // mobile: the layers pane is a bottom sheet you pull up
    $("#layers-head").onclick = function () {
      if (window.matchMedia("(max-width:820px)").matches) $("#pane-layers").classList.toggle("open");
    };

    load();
  })();
  </script>
</body>
</html>
