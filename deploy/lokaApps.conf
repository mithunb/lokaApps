# Include this inside the loka.place <VirtualHost> block(s).
# Requires: a2enmod proxy proxy_http alias rewrite
#
# Static files are served by Apache directly from /home/mithun/loka.place/lokaApps/.
# Only API calls are proxied to the Node service on 127.0.0.1:8181.
#
# Canonical prefix is /apps (aliased below); /lokaApps/* permanently redirects to it.
# Note: mod_proxy's translate hook runs before mod_alias, so the API ProxyPassMatch
# rules win over the RedirectMatch/Alias lines regardless of order here.

ProxyPreserveHost On
ProxyRequests     Off

# API — /apps|/lokaApps/<app>/api[/<subpath>]  ->  Node /api/<app>[/<subpath>]
# (the legacy /lokaApps API rule keeps already-embedded widgets working without a hop)
ProxyPassMatch ^/apps/([^/]+)/api(/.*)?$    http://127.0.0.1:8181/api/$1$2
ProxyPassMatch ^/lokaApps/([^/]+)/api(/.*)?$ http://127.0.0.1:8181/api/$1$2
ProxyPassReverse /apps/     http://127.0.0.1:8181/
ProxyPassReverse /lokaApps/ http://127.0.0.1:8181/

# Link previews (requires: a2enmod rewrite). A chat app (WhatsApp, Slack, X,
# iMessage...) reads an address's HTML without running any script, so the
# only way it ever sees a representative image and description is if the
# HTML itself already carries them. Only its own crawler is sent to Node's
# server-built page — every person, and Googlebot, keeps the plain static
# file untouched; the Share link, the pretty /a/<slug> address and every
# other route are unaffected.
RewriteEngine On
# https only: on the plain-http vhost this file is also Included in, crawlers
# must still get the 301 to https first.
RewriteCond %{HTTPS} =on
RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|Twitterbot|Slackbot|LinkedInBot|WhatsApp|TelegramBot|Discordbot|Applebot) [NC]
RewriteCond %{QUERY_STRING} (^|&)dataset=
RewriteRule ^/apps/atlas/(index\.html)?$ http://127.0.0.1:8181/api/atlas/preview [P,QSA,L]

# The pretty address keeps the embed flag through its redirect: a website that
# frames /apps/atlas/a/<slug>?embed=1 must land on the embed, not on the whole
# page with its header. RedirectMatch cannot do it — mod_alias drops the
# original query string whenever the target carries one of its own — so this
# one case is a rewrite, and it is written out rather than passed through
# ([QSA] would carry a private link's view key into the frame as well). It must
# come before the RedirectMatch below; mod_rewrite runs first in any case.
RewriteCond %{QUERY_STRING} (^|&)embed=(1|map)(&|$)
RewriteRule ^/apps/atlas/a/([a-z0-9-]+)/?$ /apps/atlas/?dataset=$1&embed=%2 [R=302,L]

# Pretty atlas instance URLs: /apps/atlas/a/<slug> -> viewer with ?dataset=<slug>
# (mod_alias: this RedirectMatch must appear before the Alias below)
RedirectMatch 302 ^/apps/atlas/a/([a-z0-9-]+)/?$ /apps/atlas/?dataset=$1

# Shortlink: /atlas -> the LOKA Atlas app (bare and any subpath)
RedirectMatch 301 ^/atlas/?(.*)$ /apps/atlas/$1

# Canonical prefix
Alias /apps /home/mithun/loka.place/lokaApps

# Old links keep working (308 preserves method + body for POSTs)
RedirectMatch 308 ^/lokaApps(/.*)?$ /apps$1

# App pages and code must revalidate on every load (requires: a2enmod headers).
# Deploys ship matched sets of HTML + JS — a browser holding yesterday's
# setup.js against today's index.html breaks the wizard in ways that look like
# "nothing happens". ETags keep revalidation cheap: unchanged files answer 304.
#
# Map files belong in the same rule for the same reason. A rebuild replaces
# user-<layer>.geojson at the SAME path, so there is nothing in the name to tell
# a browser the contents changed. Without an instruction a browser invents its
# own freshness — a tenth of the file's age is the usual guess — so a file that
# had been sitting a week could be served from a visitor's own cache for most of
# a day after it was rebuilt. They reload, see the old shapes, and conclude the
# rebuild did nothing. Revalidation costs one 304 when the file has not moved.
<Directory /home/mithun/loka.place/lokaApps>
    <FilesMatch "\.(html|js|css|json|geojson)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

# Compress what the atlas actually ships (requires: a2enmod deflate).
#
# An atlas is mostly coordinate text, which is the most compressible thing
# there is, and none of it was being compressed: the reference atlas sent 4.4 MB
# to every visitor and sends 1.4 MB now. A 228-district boundary file measured
# 3.79 MB raw against 1.18 MB gzipped. Nothing else on this box came close to
# that for the effort.
#
# geo+json is the one that matters and is not in Apache's default list, so it
# is named explicitly along with the plain types. Images, PNG tiles and pmtiles
# are already compressed and are deliberately left alone — running deflate over
# them costs CPU and returns nothing.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/geo+json
    AddOutputFilterByType DEFLATE application/json application/javascript
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Deny direct web access to the Node source tree.
<Directory /home/mithun/loka.place/lokaApps/api>
    Require all denied
</Directory>
